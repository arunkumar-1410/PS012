spring.application.name=api-gateway
server.port=${PORT:8090}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true


# =========================
# CENTRAL SWAGGER
# =========================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=Exam Service
springdoc.swagger-ui.urls[1].url=/exam-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=Submission Service
springdoc.swagger-ui.urls[2].url=/submission-service/v3/api-docs

springdoc.swagger-ui.urls[3].name=Evaluation Service
springdoc.swagger-ui.urls[3].url=/evaluation-service/v3/api-docs

springdoc.swagger-ui.urlsPrimaryName=Auth Service


# =========================
# SWAGGER ROUTES
# =========================

spring.cloud.gateway.routes[0].id=auth-swagger
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth-service/v3/api-docs
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[0].order=-1


spring.cloud.gateway.routes[1].id=exam-swagger
spring.cloud.gateway.routes[1].uri=lb://EXAM-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/exam-service/v3/api-docs
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].order=-1


spring.cloud.gateway.routes[2].id=submission-swagger
spring.cloud.gateway.routes[2].uri=lb://SUBMISSION-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/submission-service/v3/api-docs
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[2].order=-1


spring.cloud.gateway.routes[3].id=evaluation-swagger
spring.cloud.gateway.routes[3].uri=lb://EVALUATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/evaluation-service/v3/api-docs
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[3].order=-1